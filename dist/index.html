<!DOCTYPE html>
<html>
  <head>
    <title>HM: Sunshine Islands Weather Calculator</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="css/style.min.css" type="text/css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Chango&display=swap"
      rel="stylesheet"
    />
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body>
    <div id="outer-container">
      <div id="jump-to-weather-buttons"></div>
      <div id="next-crop-anchor"></div>
      <div id="calculator-body" class="limited-container">
        <div class="season-radio-buttons">
          <label for="spring"
          ><input
                  type="radio"
                  id="spring"
                  name="season"
                  value="Spring"
          />Spring</label
          >
          <label for="summer"
          ><input
                  type="radio"
                  id="summer"
                  name="season"
                  value="Summer"
          />Summer</label
          >
          <label for="fall"
          ><input
                  type="radio"
                  id="fall"
                  name="season"
                  value="Fall"
          />Fall</label
          >
          <label for="winter"
          ><input
                  type="radio"
                  id="winter"
                  name="season"
                  value="Winter"
          />Winter</label
          >
        </div>
        <div id="weather-buttons-container">
          <div data-weather="sunny" class="weather-button">
            <img src="images/hmsi_sunny.png" />
          </div>
          <div data-weather="clear" class="weather-button">
            <img src="images/hmsi_clear.png" />
          </div>
          <div data-weather="cloudy" class="weather-button">
            <img src="images/hmsi_cloudy.png" />
          </div>
          <div data-weather="drizzle" class="weather-button">
            <img src="images/hmsi_drizzle.png" />
          </div>
          <div data-weather="rainy" class="weather-button">
            <img src="images/hmsi_rainy.png" />
          </div>
          <div data-weather="snowy" class="weather-button">
            <img src="images/hmsi_snowy.png" />
          </div>
          <div data-weather="blizzard" class="weather-button">
            <img src="images/hmsi_blizzard.png" />
          </div>
          <div data-weather="hurricane" class="weather-button">
            <img src="images/hmsi_hurricane.png" />
          </div>
        </div>
        <button id="weather-buttons-undo">Undo last day</button>
      </div>

      <div id="add-crops" class="limited-container hidden">
        <div id="add-crops-reveal">+</div>
        <form id="add-crops-form" autocomplete="off">
          <label for="new-crop-dropdown">Add a crop:</label>
          <div class="select-crop-box">
            <span id="select-dropdown-arrow"></span>
            <select name="type" id="new-crop-dropdown"></select>
            <input type="submit" value="Add" />
          </div>
          <input
            type="checkbox"
            id="apply-days-weather"
            name="apply-days-weather"
            checked
          /><label for="apply-days-weather">Apply today's weather</label>
        </form>
      </div>
      <div id="add-trees" class="limited-container hidden">
        <div id="add-trees-reveal">+</div>
        <form id="add-trees-form" autocomplete="off">
          <label for="new-crop-dropdown">Add a Tree:</label>
          <div class="select-tree-box">
            <span id="select-tree-dropdown-arrow"></span>
            <select name="type" id="new-tree-dropdown"></select>
            <input type="submit" value="Add" />
          </div>
          <input
                  type="checkbox"
                  id="apply-days-weather-trees"
                  name="apply-days-weather-trees"
                  checked
          /><label for="apply-days-weather-trees">Apply today's weather</label>
        </form>
      </div>
      <div id="crops-wrapper">
        <div class="tab">
          <input type="radio" id="crop-tab" class="tab-radio" name="tab" checked="checked" />
          <label class="tab-button" for="crop-tab">Crops</label>
          <div id="current-crops" class="tab-content"></div>
        </div>
        <div class="tab">
          <input type="radio" id="tree-tab" class="tab-radio" name="tab" />
          <label class="tab-button" for="tree-tab">Trees</label>
          <div id="current-trees" class="tab-content"></div>
        </div>
      </div>
    </div>
    <script type="text/javascript" src="bundle.js"></script>
  </body>
</html>
